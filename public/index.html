<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jolee Remote</title>
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="/dashboard/dashboard.css?v=jo-ui-43" />
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#jolee-core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#root{position:relative;z-index:1}
#keyboard-input-assist{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;border:0;padding:0;caret-color:transparent}
</style>
</head>
<body>
<iframe id="jolee-core" title="Session hop core" allow="fullscreen *; clipboard-read *; clipboard-write *; microphone *; camera *"></iframe>
<input id="keyboard-input-assist" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true">
<input id="jolee-file-upload" type="file" hidden>
<div id="root"></div>
<script>
(function () {
  var search = new URLSearchParams(location.search);
  var hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  var token = hash.get("token") || search.get("token") || "";
  var session = search.get("session") || "";
  // noVNC-style tab title from hop/shell glue (?device=), not Selkies Sidebar.
  var deviceName = (search.get("device") || "").trim();
  if (deviceName) {
    document.title = "Jolee Remote - " + deviceName;
  }
  function readCookie(name) {
    try {
      var parts = document.cookie.split(";");
      for (var i = 0; i < parts.length; i++) {
        var part = parts[i];
        var idx = part.indexOf("=");
        if (idx < 0) continue;
        if (part.slice(0, idx).trim() !== name) continue;
        return decodeURIComponent(part.slice(idx + 1).trim());
      }
    } catch (e) {}
    return "";
  }
  var secure = location.protocol === "https:" ? "; Secure" : "";
  var existingSession = readCookie("jolee_session");
  // New ?session= must never keep a prior session's browser token.
  if (session && existingSession && session !== existingSession) {
    document.cookie = "jolee_session=; Path=/; Max-Age=0" + secure;
    document.cookie = "jolee_browser_token=; Path=/; Max-Age=0" + secure;
  }
  if (session) {
    document.cookie = "jolee_session=" + encodeURIComponent(session) + "; Path=/; SameSite=Lax" + secure;
  }
  if (token) {
    document.cookie = "jolee_browser_token=" + encodeURIComponent(token) + "; Path=/; SameSite=Lax" + secure;
  }
  search.delete("token");
  search.delete("device");
  search.set("embedded", "1");
  // Strip display-only ?device= (and query ?token=) from the address bar.
  try {
    var cleanSearch = new URLSearchParams(location.search);
    cleanSearch.delete("token");
    cleanSearch.delete("device");
    var cleanQs = cleanSearch.toString();
    var cleanUrl = location.pathname + (cleanQs ? "?" + cleanQs : "") + location.hash;
    if (cleanUrl !== location.pathname + location.search + location.hash) {
      history.replaceState(null, "", cleanUrl);
    }
  } catch (e) {}
  var src = "/viewer.html?" + search.toString();
  if (token) src += "#token=" + encodeURIComponent(token);
  var iframe = document.getElementById("jolee-core");
  iframe.src = src;
  var assist = document.getElementById("keyboard-input-assist");
  var fileUpload = document.getElementById("jolee-file-upload");
  function postToCore(msg) {
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage(msg, location.origin);
    }
  }
  // Do not post showVirtualKeyboard on focus: viewer focus would steal the
  // user-gesture and iOS would never open the OSK. Keys go via assistKey.
    var composing = false;
    function forwardAssistControl(e, direction) {
      // Printable characters are delivered once, by committed input below.
      if (composing || e.isComposing || e.key === "Process" || e.key === "Unidentified" || e.key === "Dead") return;
      if (Array.from(e.key || "").length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return;
      postToCore({ type: "assistKey", e: direction, key: e.key, code: e.code,
        trusted: e.isTrusted === true, ctrlKey: !!e.ctrlKey, metaKey: !!e.metaKey, shiftKey: !!e.shiftKey, altKey: !!e.altKey });
    }
    assist.addEventListener("keydown", function (e) { forwardAssistControl(e, "down"); });
    assist.addEventListener("keyup", function (e) { forwardAssistControl(e, "up"); });
    assist.addEventListener('blur', function () { postToCore({type:'clipboardPasteCancel'}); });
    function commitAssistText() {
      var v = assist.value || "";
      if (!v) return;
      // Preserve supplementary Unicode characters as one key payload.
      for (var ch of v) {
      postToCore({ type: "assistKey", e: "down", key: ch, code: "" });
      postToCore({ type: "assistKey", e: "up", key: ch, code: "" });
    }
      assist.value = "";
    }
    assist.addEventListener("compositionstart", function () { composing = true; });
    assist.addEventListener("compositionend", function () {
      composing = false;
      commitAssistText();
    });
    assist.addEventListener("input", function (e) {
      if (!composing && !e.isComposing) commitAssistText();
  });
  window.addEventListener("requestFileUpload", function () {
    fileUpload.click();
  });
  fileUpload.addEventListener("change", function () {
    var file = fileUpload.files && fileUpload.files[0];
    if (file) postToCore({ type: "fileUpload", file: file });
    fileUpload.value = "";
  });
  window.addEventListener("message", function (event) {
    if (event.origin !== location.origin || event.source !== iframe.contentWindow) return;
    var msg = event.data;
    if (!msg || typeof msg !== "object" || msg.type !== "statsUpdate") return;
    window.system_stats = msg.system_stats || {};
    window.gpu_stats = msg.gpu_stats || null;
    window.fps = Number.isFinite(msg.fps) ? msg.fps : 0;
    window.network_stats = msg.network_stats || {};
    window.currentAudioLevel = Number.isFinite(msg.currentAudioLevel) ? msg.currentAudioLevel : null;
    window.audioPlaybackState = typeof msg.audio_playback_state === 'string' ? msg.audio_playback_state : 'unavailable';
    window.audioCaptureStatus = msg.audio_capture || null;
    window.audioCaptureReceivedAt = performance.now();
  });
})();
</script>
<script type="module" src="/dashboard/dashboard.js?v=jo-ui-43"></script>
</body>
</html>
