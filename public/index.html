<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jolee Remote</title>
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="shortcut icon" href="/favicon.ico" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="/dashboard/dashboard.css?v=jo-ui-24" />
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#jolee-core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#root{position:relative;z-index:1}
#keyboard-input-assist{position:absolute;left:-9999px}
</style>
</head>
<body>
<iframe id="jolee-core" title="Session hop core" allow="fullscreen; clipboard-read; clipboard-write; microphone; camera"></iframe>
<input id="keyboard-input-assist" type="text" autocomplete="off" aria-hidden="true">
<input id="jolee-file-upload" type="file" hidden>
<div id="root"></div>
<script>
(function () {
  var search = new URLSearchParams(location.search);
  var hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  var token = hash.get("token") || search.get("token") || "";
  var session = search.get("session") || "";
  function readCookie(name) {
    try {
      var parts = document.cookie.split(";");
      for (var i = 0; i < parts.length; i++) {
        var part = parts[i];
        var idx = part.indexOf("=");
        if (idx < 0) continue;
        if (part.slice(0, idx).trim() !== name) continue;
        return decodeURIComponent(part.slice(idx + 1).trim());
      }
    } catch (e) {}
    return "";
  }
  var secure = location.protocol === "https:" ? "; Secure" : "";
  var existingSession = readCookie("jolee_session");
  // New ?session= must never keep a prior session's browser token.
  if (session && existingSession && session !== existingSession) {
    document.cookie = "jolee_session=; Path=/; Max-Age=0" + secure;
    document.cookie = "jolee_browser_token=; Path=/; Max-Age=0" + secure;
  }
  if (session) {
    document.cookie = "jolee_session=" + encodeURIComponent(session) + "; Path=/; SameSite=Lax" + secure;
  }
  if (token) {
    document.cookie = "jolee_browser_token=" + encodeURIComponent(token) + "; Path=/; SameSite=Lax" + secure;
  }
  search.delete("token");
  search.set("embedded", "1");
  var src = "/viewer.html?" + search.toString();
  if (token) src += "#token=" + encodeURIComponent(token);
  var iframe = document.getElementById("jolee-core");
  iframe.src = src;
  var assist = document.getElementById("keyboard-input-assist");
  var fileUpload = document.getElementById("jolee-file-upload");
  function postToCore(msg) {
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage(msg, location.origin);
    }
  }
  assist.addEventListener("focus", function () {
    postToCore({ type: "showVirtualKeyboard" });
  });
  assist.addEventListener("keydown", function (e) {
    postToCore({ type: "assistKey", e: "down", key: e.key, code: e.code });
  });
  assist.addEventListener("keyup", function (e) {
    postToCore({ type: "assistKey", e: "up", key: e.key, code: e.code });
  });
  window.addEventListener("requestFileUpload", function () {
    fileUpload.click();
  });
  fileUpload.addEventListener("change", function () {
    var file = fileUpload.files && fileUpload.files[0];
    if (file) postToCore({ type: "fileUpload", file: file });
    fileUpload.value = "";
  });
  window.addEventListener("message", function (event) {
    if (event.origin !== location.origin || event.source !== iframe.contentWindow) return;
    var msg = event.data;
    if (!msg || typeof msg !== "object" || msg.type !== "statsUpdate") return;
    window.system_stats = msg.system_stats || {};
    window.gpu_stats = msg.gpu_stats || null;
    window.fps = Number.isFinite(msg.fps) ? msg.fps : 0;
    window.network_stats = msg.network_stats || {};
    window.currentAudioLevel = Number.isFinite(msg.currentAudioLevel) ? msg.currentAudioLevel : 0;
  });
})();
</script>
<script type="module" src="/dashboard/dashboard.js?v=jo-ui-24"></script>
</body>
</html>
