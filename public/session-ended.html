<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session ended · Jolee Remote</title>
<style>body{margin:0;background:#171c24;color:#e6ebf3;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{max-width:32rem;padding:2rem}h1{color:#56c6ec}a{color:#56c6ec}p{line-height:1.6}</style></head>
<body><main><h1>Session ended</h1><p>This session has ended or expired. Refreshing this page will not restart it.</p><p>Open a new session for the PC through your usual device link or LetLeeAdmin.</p><p><a href="https://portal.letleein.com">Choose a device in LetLeeIn</a></p><p><a id="restart" hidden>Start New Session</a></p></main><script type="module">
import {preserveRestartName} from "/session-renewal.js";
try{const session=new URLSearchParams(location.search).get('session');const path=sessionStorage.getItem('jolee-restart:'+session);if(path){const url=new URL(path,location.origin);if(url.origin===location.origin&&url.pathname==='/'&&url.searchParams.has('clientId')&&url.searchParams.has('agentId')){preserveRestartName(url,session,sessionStorage.getItem('jolee_tab_device'));const link=document.getElementById('restart');link.href=url.pathname+url.search;link.hidden=false;}}}catch{}
</script></body></html>
