  moveOverlay(e);
  applyCursorMode();
  pointerInput.move(e);
});
canvas.addEventListener("touchstart",()=>{
  // Blur keyboard-input-assist on stream touch (Selkies overlayInput behavior).
  if(document.activeElement===vk){
    vk.blur();
    vk.setAttribute("aria-hidden","true");
    vk.classList.remove("show");
  }
},{passive:true});
canvas.addEventListener("pointerdown",(e)=>{
  if(!pointerInput.down(e))return;
  canvas.focus();
  // Capture failure must not abort the matching release handling on window.
  try{canvas.setPointerCapture(e.pointerId);}catch{}
  pointerOver=true;
  moveOverlay(e);
  applyCursorMode();
  unlockAudioFromGesture();
});
window.addEventListener("pointerup",(e)=>pointerInput.up(e));
canvas.addEventListener("pointercancel",(e)=>{pointerInput.lost(e);hideDrawnCursor();});
canvas.addEventListener("lostpointercapture",(e)=>pointerInput.lost(e));
window.addEventListener("blur",()=>{pointerInput.cancel();hideDrawnCursor();});
window.addEventListener("pagehide",()=>{pointerInput.cancel();hideDrawnCursor();});
document.addEventListener("visibilitychange",()=>{if(document.hidden){pointerInput.cancel();hideDrawnCursor();}});
canvas.addEventListener("pointerenter",(e)=>{
  pointerOver=true;
  moveOverlay(e);
  applyCursorMode();
});
canvas.addEventListener("pointerleave",leaveCursor);
canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const p=pointerNorm(e);
  sendInput({t:"wheel",dx:e.deltaX,dy:e.deltaY,x:p.x,y:p.y});
},{passive:false});
canvas.addEventListener("contextmenu",(e)=>{e.preventDefault();});
// Keys stay on the canvas (and #vk). Do not window-capture: dashboard .allow-native-input must keep typing.
function sendKeyFromUI(e,direction){
  clipboardPaste.key({t:'key',e:direction,key:e.key,code:e.code},
    {trusted:e.isTrusted,ctrlKey:e.ctrlKey,metaKey:e.metaKey,shiftKey:e.shiftKey,altKey:e.altKey});
}
canvas.addEventListener("keydown",(e)=>{sendKeyFromUI(e,'down');e.preventDefault();});
canvas.addEventListener("keyup",(e)=>{sendKeyFromUI(e,'up');e.preventDefault();});
vk.addEventListener("keydown",(e)=>sendKeyFromUI(e,'down'));
vk.addEventListener("keyup",(e)=>sendKeyFromUI(e,'up'));
for(const target of [canvas,vk,window])target.addEventListener('blur',()=>clipboardPaste.cancel('target_unavailable'));
window.addEventListener("message",(event)=>{
  if(event.origin!==window.location.origin) return;
  if(window.parent!==window && event.source!==window.parent) return;
  let msg=event.data;
  if(!msg||typeof msg!=="object") return;
  switch(msg.type){
    case "connect": connect(msg); break;
    case "disconnect": disconnect(); break;
    case "requestFullscreen": requestFullscreen(); break;
    case "setScaleLocally":
      scaleLocally=!!msg.value;
      applyScale();
      break;
    case "showVirtualKeyboard": showVirtualKeyboard(); break;
    case "clipboardUpdateFromUI": clipboardUpdateFromUI(msg.text); break;
    case "clipboardImageUpdate":
      clipboardImageUpdateFromUI(msg.imageBlob);
      break;
    case "fileUpload": sendFile(msg.file); break;
    case "assistKey":
      clipboardPaste.key({t:'key',e:msg.e==='up'?'up':'down',key:msg.key,code:msg.code},
        {trusted:msg.trusted===true,ctrlKey:msg.ctrlKey===true,metaKey:msg.metaKey===true,shiftKey:msg.shiftKey===true,altKey:msg.altKey===true});
      break;
    case 'clipboardPasteCancel':
      clipboardPaste.cancel('target_unavailable');
      break;
    case "setAntiAliasing":
      antiAliasing=!!msg.value;
      applySmoothing();
      break;
    case "setUseBrowserCursors":
      useBrowserCursors=!!msg.value;
      applyCursorMode();
      if(window.parent!==window)window.parent.postMessage({type:'effectiveCursorState',value:useBrowserCursors},window.location.origin);
      break;
    case "micChunk":
      if(sessionPaired && microphoneForwarding && agentStats.microphone_supported===true && performance.now()-agentStatsReceivedAt<5000 && typeof msg.mime==="string" && typeof msg.data==="string" && msg.data){
        if(msg.mime==='audio/pcm;format=s16le;rate=24000;channels=1' && agentStats.microphone_formats?.includes(msg.mime)
          && msg.sample_rate===24000 && msg.channels===1 && Number.isSafeInteger(msg.sequence) && msg.sequence>=0
          && /^[A-Za-z0-9+/]{3200}$/.test(msg.data) && socket?.bufferedAmount<65536){
          sendInput({t:"mic",mime:msg.mime,data:msg.data,sample_rate:24000,channels:1,sequence:msg.sequence});
        }
      }
      break;
    case "pipelineControl":
      if(msg.pipeline==="video") setVideoEnabled(!!msg.enabled);
      if(msg.pipeline==="audio") setAudioEnabled(!!msg.enabled);
      if(msg.pipeline==="microphone") setMicrophoneForwarding(!!msg.enabled);
      if(msg.pipeline==="webcam") setWebcamEnabled(!!msg.enabled);
      if(typeof msg.pipeline==="string"&&msg.pipeline!=="webcam") sendInput({t:"pipeline",pipeline:msg.pipeline,enabled:!!msg.enabled});
      break;
    case "audioDeviceSelected":
      if(typeof msg.context==="string"){
        sendInput({t:"audioDevice",context:msg.context,deviceId:msg.deviceId});
      }
      if(msg.context==="input"){
        audioInputDeviceId=typeof msg.deviceId==="string"?msg.deviceId:"";
        // Parent owns live mic capture + device swap; viewer only tracks the id.
      }
      if(msg.context==="output"){
        selectAudioOutput(typeof msg.deviceId==="string"?msg.deviceId:"");
      }
      break;
    case "selectRemoteDisplay":
    case "setDisplayMode":
    case "setBestFit":
      requestCatalogDisplay(msg);
      break;
    case "setManualResolution":
      screenAutoEnabled=false;
      scheduleScreenResize();
      requestScreenSize(msg.width,msg.height,'manual');
      break;
    case "resetResolutionToWindow":
      screenAutoEnabled=true;
      requestWindowSize();
      break;
    case "setUseCssScaling":
      screenUseCssScaling=!!msg.value;
      sendInput({t:"cssScaling",value:!!msg.value});
      if(screenAutoEnabled)requestWindowSize();
      break;
    case "settings":
      if(msg.settings){
        if(Object.hasOwn(msg.settings,'audio_bitrate')){
          if(audioEnabled&&sessionPaired)audioControl.select(Number(msg.settings.audio_bitrate));
          msg={...msg,settings:{...msg.settings}};delete msg.settings.audio_bitrate;
        }
        if(typeof msg.settings.force_aligned_resolution==='boolean'&&screenAligned!==msg.settings.force_aligned_resolution){
          screenAligned=msg.settings.force_aligned_resolution;
          scheduleScreenResize();
        }
        sendInput({t:"settings",settings:msg.settings});
      }
      break;
    case "command": {
      const value=String(msg.value??msg.command??msg.payload?.command??"");
      const compact=value.toLowerCase().replace(/[^a-z]/g,"");
      if(compact==="ctrlaltdel"||compact==="ctrlaltdelete") sasControl.request();
      else sendInput(Object.assign({t:"command"},msg));
      break;
    }
    case "getSasState": sasControl.publish(); break;
    case "getStats": postStats(); break;
    // Apps and Sharing stay hidden. Gaming stays noop. Pointer lock is not used.
    // Gaming stays noop. Pointer lock is not used.
    case "gamepadControl":
    case "requestGamingMode":
    case "sidebarVisibilityChanged":
    case "TOUCH_GAMEPAD_SETUP":
    case "TOUCH_GAMEPAD_VISIBILITY":
    case "touchinput:trackpad":
    case "touchinput:touch":
    case "setSynth":
    case "mode":
      break;
    default:
      break;
  }
});
const uploadControl=new UploadControl({
  encode:encodeInput,
  send:(frame,connection)=>{if(!sessionPaired||socket!==connection||connection.readyState!==1)throw new Error('Disconnected');connection.send(frame);},
  report:payload=>{if(window.parent!==window)window.parent.postMessage({type:'fileUpload',payload},window.location.origin);},
});
applyScale();
applySmoothing();
applyCursorMode();
window.addEventListener('resize',scheduleScreenResize);
setStatus("disconnected");
if(session.trim()&&token.trim()) connect();
</script></body></html>
