function applyScale(){

function applySmoothing(){

function applyCursorMode(){

function setStatus(state){

}
function encodeInput(payload){const body=new TextEncoder().encode(JSON.stringify(payload));const out=new Uint8Array(2+body.length);out[0]=VERSION;out[1]=KIND_INPUT;out.set(body,2);return out;}
function decodeEnvelope(data){
  const bytes=data instanceof ArrayBuffer?new Uint8Array(data):new Uint8Array(data);
  if(bytes.length<2||bytes[0]!==VERSION)return null;
  if(bytes[1]===KIND_FRAME)return {kind:"frame",payload:bytes.subarray(2)};
  if(bytes[1]===KIND_INPUT)return {kind:"input",payload:bytes.subarray(2)};
  if(bytes[1]===KIND_AUDIO)return {kind:"audio",payload:bytes.subarray(2)};
  return null;
}
function parseJsonFrameObject(payload){
  try{
    let i=0;
    while(i<payload.length&&(payload[i]===0x20||payload[i]===0x09||payload[i]===0x0a||payload[i]===0x0d)) i++;
    if(i>=payload.length||payload[i]!==0x7b) return null;
    const obj=JSON.parse(new TextDecoder().decode(payload));
    if(!(obj&&typeof obj==="object")) return null;
    return obj;
  }catch(e){return null;}
}
function fileFromFrame(payload){
  const obj=parseJsonFrameObject(payload);
  if(!obj||!(obj.t==="file"||obj.type==="file")) return null;
  if(typeof obj.name!=="string"||typeof obj.data!=="string") return null;
  return {name:obj.name,mime:typeof obj.mime==="string"?obj.mime:"application/octet-stream",data:obj.data};
}
function statsFromFrame(payload){
  const obj=parseJsonFrameObject(payload);
  if(!obj||!(obj.t==="stats"||obj.type==="stats")) return null;
  return obj;
}
function printFromFrame(payload){
  const obj=parseJsonFrameObject(payload);
  if(!obj||!(obj.t==="print"||obj.type==="print")) return null;
  if(typeof obj.data!=="string") return null;
  const parts=typeof obj.parts==="number"&&isFinite(obj.parts)&&obj.parts>=1?Math.floor(obj.parts):1;
  const part=typeof obj.part==="number"&&isFinite(obj.part)&&obj.part>=0?Math.floor(obj.part):0;
  if(part>=parts) return null;
  return {
    name:typeof obj.name==="string"&&obj.name?obj.name:"print.pdf",
    mime:typeof obj.mime==="string"&&obj.mime?obj.mime:"application/pdf",
    data:obj.data,
    job:typeof obj.job==="string"&&obj.job?obj.job:"single",
    part,
    parts

}
function clipboardTextFromFrame(payload){
  const obj=parseJsonFrameObject(payload);

  if(!(obj.t==="clipboard"||obj.type==="clipboard")) return null;
  if(typeof obj.mime==="string"&&obj.mime.indexOf("image/")===0&&typeof obj.data==="string"){
    return {kind:"image",mime:obj.mime,data:obj.data};
  }

}
function cursorFromFrame(payload){
  const obj=parseJsonFrameObject(payload);
  if(!obj) return null;
  if(!(obj.t==="cursor"||obj.type==="cursor")) return null;
  const hx=typeof obj.hx==="number"&&isFinite(obj.hx)?obj.hx:0;
  const hy=typeof obj.hy==="number"&&isFinite(obj.hy)?obj.hy:0;
  const mime=typeof obj.mime==="string"?obj.mime:"";
  const data=typeof obj.data==="string"?obj.data:"";
  return {visible:obj.visible!==false,hx,hy,mime,data};
}
function applyCursorFrame(cur){
  agentCursorVisible=!!cur.visible;
  if(cur.visible){
    if(cur.mime&&cur.data){
      cursorEl.src="data:"+cur.mime+";base64,"+cur.data;
      cursorHx=cur.hx;
      cursorHy=cur.hy;
    }else if(!cursorEl.src){

      cursorHx=DEFAULT_CURSOR_HX;
      cursorHy=DEFAULT_CURSOR_HY;

}
function contentBox(){
  const r=canvas.getBoundingClientRect();
  if(!scaleLocally) return {left:r.left,top:r.top,width:r.width,height:r.height};
  const bw=canvas.width||1, bh=canvas.height||1;
  const scale=Math.min(r.width/bw, r.height/bh);
  const dw=bw*scale, dh=bh*scale;
  return {left:r.left+(r.width-dw)/2, top:r.top+(r.height-dh)/2, width:dw, height:dh};
}
function pointerNorm(e){
  const b=contentBox();
  const w=b.width||1, h=b.height||1;
  return {x:(e.clientX-b.left)/w, y:(e.clientY-b.top)/h};
}
function moveOverlay(e){
  const r=stage.getBoundingClientRect();

async function paintJpegOrPng(payload){const bitmap=await createImageBitmap(new Blob([payload]));canvas.width=bitmap.width;canvas.height=bitmap.height;applySmoothing();ctx.drawImage(bitmap,0,0);bitmap.close();frameCount++;}
async function paintH264(payload){if(typeof VideoDecoder==="undefined")throw new Error("no WebCodecs");if(!videoDecoder||videoDecoder.state==="closed"){videoDecoder=new VideoDecoder({output:(frame)=>{canvas.width=frame.displayWidth;canvas.height=frame.displayHeight;applySmoothing();ctx.drawImage(frame,0,0);frame.close();frameCount++;},error:()=>{}});videoDecoder.configure({codec:"avc1.42E01E"});}videoDecoder.decode(new EncodedVideoChunk({type:payload.length>4&&payload[4]===5?"key":"delta",timestamp:performance.now()*1000,data:payload}));}
async function paintFrame(payload){try{await paintJpegOrPng(payload);return;}catch(e){}try{await paintH264(payload);}catch(e){ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#888";ctx.fillText("opaque frame "+payload.length+" bytes",16,24);}}
function revokeAudioUrl(){
  if(audioUrl){try{URL.revokeObjectURL(audioUrl);}catch(e){}audioUrl=null;}
}
function stopAudioPlayback(){
  if(playingAudio){
    try{playingAudio.pause();}catch(e){}
    playingAudio.removeAttribute("src");
    try{playingAudio.load();}catch(e){}
    playingAudio=null;
  }
  revokeAudioUrl();
}
function postPipelineStatus(pipeline,enabled,error){
  const msg={type:"pipelineStatusUpdate",[pipeline]:!!enabled};
  if(error) msg.error=error;
  if(window.parent!==window) window.parent.postMessage(msg,window.location.origin);
}
function clearMicrophoneResources(){
  // Bump gen first so in-flight start/chunk/stop handlers ignore teardown.
  microphoneGen++;
  const rec=microphoneRecorder;
  microphoneRecorder=null;
  if(rec&&rec.state!=="inactive") try{rec.stop();}catch(e){}
  if(microphoneStream) microphoneStream.getTracks().forEach((track)=>track.stop());
  microphoneStream=null;
}
function stopMicrophone(error){
  clearMicrophoneResources();
  postPipelineStatus("microphone",false,error);
}
function createMicrophoneRecorder(stream){
  if(typeof MediaRecorder==="undefined"){
    const err=new Error("MediaRecorder unavailable");
    err.name="NotSupportedError";
    throw err;
  }
  // isTypeSupported can lie on some Windows Chrome builds; try each mime, then bare.
  const preferred=["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  let lastErr=null;
  for(const mime of preferred){
    if(!MediaRecorder.isTypeSupported(mime)) continue;
    try{return new MediaRecorder(stream,{mimeType:mime});}catch(e){lastErr=e;}
  }
  try{return new MediaRecorder(stream);}catch(e){throw lastErr||e;}
}
async function setMicrophoneEnabled(enabled){
  if(!enabled){stopMicrophone();return;}
  if(microphoneRecorder&&microphoneRecorder.state==="recording") return;
  // Drop leftover inactive recorder/stream without posting false (avoids UI flicker).
  if(microphoneRecorder||microphoneStream) clearMicrophoneResources();
  const gen=++microphoneGen;
  try{
    const audio=audioInputDeviceId&&audioInputDeviceId!=="default"
      ?{deviceId:{ideal:audioInputDeviceId}}
      :true;
    microphoneStream=await navigator.mediaDevices.getUserMedia({audio});
    if(gen!==microphoneGen){
      microphoneStream.getTracks().forEach((track)=>track.stop());
      microphoneStream=null;
      return;
    }
    let recorder=null;
    let startErr=null;
    try{
      recorder=createMicrophoneRecorder(microphoneStream);
      recorder.start(250);
    }catch(e){
      startErr=e;
      // Preferred mime/start failed: tear down typed recorder and retry bare once.
      try{if(recorder&&recorder.state!=="inactive") recorder.stop();}catch(ignore){}
      try{
        recorder=new MediaRecorder(microphoneStream);
        recorder.start(250);
        startErr=null;
      }catch(e2){startErr=e2;recorder=null;}
    }
    if(startErr||!recorder) throw startErr||new Error("MediaRecorder start failed");
    if(gen!==microphoneGen){
      try{if(recorder.state!=="inactive") recorder.stop();}catch(e){}
      if(microphoneStream){microphoneStream.getTracks().forEach((track)=>track.stop());microphoneStream=null;}
      return;
    }
    microphoneRecorder=recorder;
    recorder.addEventListener("dataavailable",async(event)=>{
      if(gen!==microphoneGen||!event.data||!event.data.size) return;
      try{
        const data=bytesToBase64(new Uint8Array(await event.data.arrayBuffer()));
        if(gen!==microphoneGen) return;
        sendInput({t:"mic",mime:event.data.type||recorder.mimeType||"audio/webm",data});
      }catch(chunkErr){
        console.warn("[jolee] microphone chunk failed", chunkErr&&chunkErr.name, chunkErr&&chunkErr.message);
      }
    });
    recorder.addEventListener("error",(event)=>{
      if(gen!==microphoneGen) return;
      const err=event&&event.error;
      console.warn("[jolee] microphone recorder error", err&&err.name, err&&err.message);
      stopMicrophone((err&&err.name)||"MediaRecorderError");
    });
    // Unexpected stop (stream ended) — do not use an unconditional stop→false
    // listener that can race a fresh start after stopMicrophone().

      if(gen!==microphoneGen) return;
      if(microphoneRecorder!==recorder) return;
      microphoneRecorder=null;
      if(microphoneStream){
        microphoneStream.getTracks().forEach((track)=>track.stop());
        microphoneStream=null;
      }
      postPipelineStatus("microphone",false,"RecorderStopped");
    },{once:true});
    postPipelineStatus("microphone",true);
  }catch(e){
    if(gen!==microphoneGen) return;
    console.warn("[jolee] microphone start failed", e && e.name, e && e.message);
    stopMicrophone(e&&e.name);
  }
}
function stopWebcam(error){
  if(webcamTimer!==null) clearInterval(webcamTimer);
  webcamTimer=null;
  if(webcamStream) webcamStream.getTracks().forEach((track)=>track.stop());
  webcamStream=null;
  postPipelineStatus("webcam",false,error);
}
async function setWebcamEnabled(enabled){
  if(!enabled){stopWebcam();return;}
  if(webcamStream) return;
  try{
    webcamStream=await navigator.mediaDevices.getUserMedia({video:true});
    const video=document.createElement("video");
    video.muted=true; video.playsInline=true; video.srcObject=webcamStream;
    await video.play();

    const capture=()=>{
      if(!webcamStream||video.readyState<2) return;
      still.width=video.videoWidth||640; still.height=video.videoHeight||480;
      stillCtx.drawImage(video,0,0,still.width,still.height);
      still.toBlob(async(blob)=>{
        if(!blob||!webcamStream) return;
        const data=bytesToBase64(new Uint8Array(await blob.arrayBuffer()));

      },"image/jpeg",0.8);
    };

    postPipelineStatus("webcam",true);
  }catch(e){console.warn("[jolee] webcam start failed", e && e.name, e && e.message);stopWebcam(e&&e.name);}
}
function downloadFile(file){
  try{
    const raw=atob(file.data), bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    downloadBytes({name:file.name,mime:file.mime,bytes});
  }catch(e){}
}
function base64ToBytes(b64){
  const raw=atob(b64), bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
  return bytes;
}
function downloadBytes(file){
  try{
    const url=URL.createObjectURL(new Blob([file.bytes],{type:file.mime||"application/octet-stream"}));
    const link=document.createElement("a");
    link.href=url; link.download=file.name||"download"; link.style.display="none";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){}
}
function isPrintableMime(mime){
  return mime==="application/pdf"||(typeof mime==="string"&&mime.indexOf("image/")===0);
}
function openPrintPreview(file){
  if(!isPrintableMime(file.mime)){
    downloadBytes(file);
    return;
  }
  let url="";
  try{
    url=URL.createObjectURL(new Blob([file.bytes],{type:file.mime}));
    const iframe=document.createElement("iframe");
    iframe.setAttribute("aria-hidden","true");
    iframe.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;pointer-events:none";
    const cleanup=()=>{
      try{iframe.remove();}catch(e){}
      if(url){try{URL.revokeObjectURL(url);}catch(e){} url="";}
    };
    const tryWindowPrint=()=>{
      try{
        const w=window.open(url,"_blank");
        if(!w){downloadBytes(file);cleanup();return;}
        const run=()=>{try{w.focus();w.print();}catch(e){downloadBytes(file);} setTimeout(()=>{try{w.close();}catch(e){} cleanup();},60000);};
        if(w.document&&w.document.readyState==="complete") run();
        else w.addEventListener("load",run,{once:true});
      }catch(e){downloadBytes(file);cleanup();}
    };
    iframe.addEventListener("load",()=>{
      try{
        const win=iframe.contentWindow;
        if(!win){tryWindowPrint();return;}
        win.focus();
        win.print();
        setTimeout(cleanup,60000);
      }catch(e){tryWindowPrint();}
    },{once:true});
    iframe.src=url;
    document.body.appendChild(iframe);
  }catch(e){
    if(url){try{URL.revokeObjectURL(url);}catch(err){}}
    downloadBytes(file);
  }
}
function handlePrintFrame(pf){
  if(window.parent!==window){
    window.parent.postMessage({type:"printJob",name:pf.name,mime:pf.mime},window.location.origin);
  }
  let bytes;
  try{bytes=base64ToBytes(pf.data);}catch(e){return;}
  if(pf.parts<=1){
    openPrintPreview({name:pf.name,mime:pf.mime,bytes});
    return;
  }
  let job=printJobChunks.get(pf.job);
  if(!job||job.parts!==pf.parts){
    job={name:pf.name,mime:pf.mime,parts:pf.parts,chunks:new Array(pf.parts)};
    printJobChunks.set(pf.job,job);
  }
  job.name=pf.name;
  job.mime=pf.mime;
  job.chunks[pf.part]=bytes;
  if(!job.chunks.every((chunk)=>chunk instanceof Uint8Array)) return;
  printJobChunks.delete(pf.job);
  const total=job.chunks.reduce((n,chunk)=>n+chunk.length,0);
  const merged=new Uint8Array(total);
  let offset=0;
  for(const chunk of job.chunks){merged.set(chunk,offset);offset+=chunk.length;}
  openPrintPreview({name:job.name,mime:job.mime,bytes:merged});
}
function applyAudioSink(el){
  if(!el || !audioSinkId) return;
  if(typeof HTMLMediaElement!=="undefined" && typeof HTMLMediaElement.prototype.setSinkId==="function" && typeof el.setSinkId==="function"){
    Promise.resolve(el.setSinkId(audioSinkId)).catch(()=>{});
  }
}
function setVideoEnabled(enabled){

    }catch(e){}

}
function setAudioEnabled(enabled){
  audioEnabled=!!enabled;

  if(pendingAudioPayload){
    const pending=pendingAudioPayload;
    pendingAudioPayload=null;
    playAudioChunk(pending);

}
function audioTypesFor(payload){
  // Prefer real container from magic bytes so WAV is not tried as webm/ogg first.
  if(payload&&payload.length>=12&&payload[0]===0x52&&payload[1]===0x49&&payload[2]===0x46&&payload[3]===0x46&&payload[8]===0x57&&payload[9]===0x41&&payload[10]===0x56&&payload[11]===0x45){
    return ["audio/wav","audio/wave"].concat(AUDIO_TYPES.filter((t)=>t!=="audio/wav"));
  }
  if(payload&&payload.length>=4&&payload[0]===0x4f&&payload[1]===0x67&&payload[2]===0x67&&payload[3]===0x53){
    return ["audio/ogg"].concat(AUDIO_TYPES.filter((t)=>t!=="audio/ogg"));
  }
  if(payload&&payload.length>=4&&payload[0]===0x1a&&payload[1]===0x45&&payload[2]===0xdf&&payload[3]===0xa3){
    return ["audio/webm"].concat(AUDIO_TYPES.filter((t)=>t!=="audio/webm"));
  }
  return AUDIO_TYPES.slice();
}
async function playAudioChunk(payload){
  if(!audioEnabled) return;
  const types=audioTypesFor(payload);
  let lastErr=null;
  let blocked=false;
  for(const type of types){
    const url=URL.createObjectURL(new Blob([payload],{type}));
    const el=new Audio();
    el.muted=!audioEnabled;
    try{
      applyAudioSink(el);
      el.src=url;
      await el.play();
      stopAudioPlayback();
      audioUrl=url;
      playingAudio=el;
      pendingAudioPayload=null;
      audioFailLogged=false;
      el.muted=!audioEnabled;
      applyAudioSink(el);
      el.addEventListener("ended",()=>{if(audioUrl===url){revokeAudioUrl();if(playingAudio===el)playingAudio=null;}},{once:true});
      console.info("[jolee] audio play ok", type, payload.length);
      return;
    }catch(e){
      lastErr=e;
      try{URL.revokeObjectURL(url);}catch(err){}
      if(e&&e.name==="NotAllowedError"){blocked=true;break;}
    }
  }
  if(blocked) pendingAudioPayload=payload;
  if(!audioFailLogged){
    audioFailLogged=true;
    const name=lastErr&&lastErr.name||"Error";
    const msg=lastErr&&lastErr.message||String(lastErr||"play failed");
    console.warn("[jolee] audio play failed", name, msg, blocked?"(autoplay; click canvas or sound toggle to retry)":"");
  }
}
function unlockAudioFromGesture(){
  if(!pendingAudioPayload||!audioEnabled) return;
  const pending=pendingAudioPayload;
  pendingAudioPayload=null;
  playAudioChunk(pending);
}
function disconnect(){if(socket){socket.close();socket=null;}if(videoDecoder){try{videoDecoder.close();}catch(e){}videoDecoder=null;}stopAudioPlayback();stopMicrophone();stopWebcam();printJobChunks.clear();setStatus("disconnected");}
function connect(opts){
  if(opts&&typeof opts==="object"){
    if(typeof opts.session==="string") session=opts.session;
    if(typeof opts.token==="string") token=opts.token;
    if(typeof opts.hop==="string") hop=opts.hop;
  }
  session=session.trim();
  token=token.trim();
  hop=hop.trim();
  const host=hop||location.host;
  if(!session||!token){setStatus("disconnected");return;}
  disconnect();
  const url=new URL(location.href);
  url.searchParams.set("session",session);
  url.searchParams.delete("token");
  if(hop)url.searchParams.set("hop",hop);else url.searchParams.delete("hop");
  url.hash=token?"token="+encodeURIComponent(token):"";
  history.replaceState(null,"",url);
  socket=new PartySocket({host:host,party:"session",room:session,query:{token:token,role:"browser"},maxRetries:3});
  socket.binaryType="arraybuffer";
  socket.addEventListener("open",()=>setStatus("waiting"));
  socket.addEventListener("close",(ev)=>{
    if(ev&&(ev.code===4000||ev.code===4004||ev.code===4010)){
      try{if(socket)socket.maxRetries=0;}catch(e){}
      disconnect();
      return;
    }
    setStatus("disconnected");
  });
  socket.addEventListener("message",(ev)=>{
    if(typeof ev.data==="string"){
      try{const msg=JSON.parse(ev.data);if(msg.type==="status")setStatus(msg.state);}catch(e){}
      return;
    }
    const env=decodeEnvelope(ev.data);
    if(!env) return;
    bytesSinceStats+=env.payload.length+2;
    if(env.kind==="audio"){playAudioChunk(env.payload);return;}
    if(env.kind!=="frame") return;
    const clip=clipboardTextFromFrame(env.payload);
    if(clip!==null){
      if(window.parent!==window){
        if(clip.kind==="image"){
          window.parent.postMessage({type:"clipboardImageUpdate",mime:clip.mime,data:clip.data}, window.location.origin);
        }else{
          window.parent.postMessage({type:"clipboardContentUpdate",text:clip.text}, window.location.origin);
        }
      }
      return;
    }
    const cur=cursorFromFrame(env.payload);
    if(cur!==null){
      applyCursorFrame(cur);
      return;
    }
    const file=fileFromFrame(env.payload);
    if(file!==null){downloadFile(file);return;}
    const stats=statsFromFrame(env.payload);
    if(stats!==null){agentStats=stats;postStats();return;}
    const print=printFromFrame(env.payload);
    if(print!==null){handlePrintFrame(print);return;}
    if(!videoEnabled) return;
    paintFrame(env.payload);
  });
}
function sendInput(payload){if(!socket||socket.readyState!==1)return;const encoded=encodeInput(payload);if(encoded.length>MAX_ENVELOPE_BYTES)return;socket.send(encoded);}
function requestFullscreen(){
  const el=stage;
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(req) Promise.resolve(req.call(el)).catch(()=>{});
}
function showVirtualKeyboard(){
  // Parent shell owns #keyboard-input-assist + OSK (Selkies). Do not steal
  // focus to canvas/vk — that was the mobile keyboard regression.
}
function clipboardUpdateFromUI(text){
  sendInput({t:"clipboard",text:String(text||"")});
}
const MAX_ENVELOPE_BYTES=1048576;
function bytesToBase64(bytes){
  let bin="";
  for(let i=0;i<bytes.length;i+=8192){
    bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  }
  return btoa(bin);
}
async function clipboardImageUpdateFromUI(blob){
  if(!(blob instanceof Blob)) return;
  try{
    const buf=await blob.arrayBuffer();
    const encoded=encodeInput({t:"clipboard",mime:blob.type||"image/png",data:bytesToBase64(new Uint8Array(buf))});
    if(encoded.length>MAX_ENVELOPE_BYTES) return;
    if(!socket||socket.readyState!==1) return;
    socket.send(encoded);
  }catch(e){}
}
async function sendFile(blob){
  if(!(blob instanceof Blob)) return;
  try{
    const data=bytesToBase64(new Uint8Array(await blob.arrayBuffer()));
    const encoded=encodeInput({t:"file",name:typeof blob.name==="string"?blob.name:"upload",mime:blob.type||"application/octet-stream",data});
    if(encoded.length>MAX_ENVELOPE_BYTES||!socket||socket.readyState!==1) return;
    socket.send(encoded);
  }catch(e){}
}
function numberOr(value,fallback=0){return typeof value==="number"&&isFinite(value)?value:fallback;}
function postStats(){
  const now=performance.now(), elapsed=Math.max(1,now-statsStartedAt);
  const hopFps=frameCount*1000/elapsed;
  const hopBandwidth=bytesSinceStats*8/elapsed/1000;
  const system=agentStats.system_stats||agentStats.system||{
    cpu_percent:numberOr(agentStats.cpu_percent,0),
    mem_used:numberOr(agentStats.mem_used,0),
    mem_total:numberOr(agentStats.mem_total,0)
  };
  const hasFlatGpu=agentStats.gpu_percent!==undefined||agentStats.gpu_mem_used!==undefined||agentStats.gpu_mem_total!==undefined;
  const gpu=agentStats.gpu_stats||agentStats.gpu||(hasFlatGpu?{
    gpu_percent:numberOr(agentStats.gpu_percent,0),
    mem_used:numberOr(agentStats.gpu_mem_used,0),
    mem_total:numberOr(agentStats.gpu_mem_total,0)
  }:null);
  const network=Object.assign({bandwidth_mbps:numberOr(agentStats.bandwidth_mbps,hopBandwidth),latency_ms:numberOr(agentStats.latency_ms,0)},agentStats.network_stats||agentStats.network||{});
  const stats={type:"statsUpdate",system_stats:system,gpu_stats:gpu,fps:numberOr(agentStats.fps,hopFps),network_stats:network,currentAudioLevel:numberOr(agentStats.currentAudioLevel??agentStats.audio_level,0)};
  if(window.parent!==window) window.parent.postMessage(stats,window.location.origin);
  frameCount=0; bytesSinceStats=0; statsStartedAt=now;
}
setInterval(postStats,1000);
canvas.addEventListener("pointermove",(e)=>{
  pointerOver=true;
  moveOverlay(e);
  applyCursorMode();
  const p=pointerNorm(e);
  sendInput({t:"pointer",e:"move",x:p.x,y:p.y,b:e.buttons});
});
canvas.addEventListener("touchstart",()=>{
  // Blur keyboard-input-assist on stream touch (Selkies overlayInput behavior).
  if(document.activeElement===vk){
    vk.blur();
    vk.setAttribute("aria-hidden","true");
    vk.classList.remove("show");
  }
},{passive:true});
canvas.addEventListener("pointerdown",(e)=>{
  canvas.focus();
  canvas.setPointerCapture(e.pointerId);
  pointerOver=true;
  moveOverlay(e);
  applyCursorMode();
  unlockAudioFromGesture();
  const p=pointerNorm(e);
  sendInput({t:"pointer",e:"down",x:p.x,y:p.y,b:e.button});
});
canvas.addEventListener("pointerup",(e)=>{
  const p=pointerNorm(e);
  sendInput({t:"pointer",e:"up",x:p.x,y:p.y,b:e.button});
});
canvas.addEventListener("pointerenter",(e)=>{
  pointerOver=true;
  moveOverlay(e);
  applyCursorMode();
});
canvas.addEventListener("pointerleave",()=>{
  pointerOver=false;
  applyCursorMode();
});
canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const p=pointerNorm(e);
  sendInput({t:"wheel",dx:e.deltaX,dy:e.deltaY,x:p.x,y:p.y});
},{passive:false});
canvas.addEventListener("contextmenu",(e)=>{e.preventDefault();});
// Keys stay on the canvas (and #vk). Do not window-capture: dashboard .allow-native-input must keep typing.
canvas.addEventListener("keydown",(e)=>{sendInput({t:"key",e:"down",key:e.key,code:e.code});e.preventDefault();});
canvas.addEventListener("keyup",(e)=>{sendInput({t:"key",e:"up",key:e.key,code:e.code});e.preventDefault();});
vk.addEventListener("keydown",(e)=>{sendInput({t:"key",e:"down",key:e.key,code:e.code});});
vk.addEventListener("keyup",(e)=>{sendInput({t:"key",e:"up",key:e.key,code:e.code});});
window.addEventListener("message",(event)=>{
  if(event.origin!==window.location.origin) return;
  if(window.parent!==window && event.source!==window.parent) return;
  const msg=event.data;
  if(!msg||typeof msg!=="object") return;
  switch(msg.type){
    case "connect": connect(msg); break;
    case "disconnect": disconnect(); break;
    case "requestFullscreen": requestFullscreen(); break;
    case "setScaleLocally":
      scaleLocally=!!msg.value;
      applyScale();
      break;
    case "showVirtualKeyboard": showVirtualKeyboard(); break;
    case "clipboardUpdateFromUI": clipboardUpdateFromUI(msg.text); break;
    case "clipboardImageUpdate":
      clipboardImageUpdateFromUI(msg.imageBlob);
      break;
    case "fileUpload": sendFile(msg.file); break;
    case "assistKey":
      sendInput({t:"key",e:msg.e==="up"?"up":"down",key:msg.key,code:msg.code});
      break;
    case "setAntiAliasing":
      antiAliasing=!!msg.value;
      applySmoothing();
      break;
    case "setUseBrowserCursors":
      useBrowserCursors=!!msg.value;
      applyCursorMode();
      break;
    case "pipelineControl":
      if(msg.pipeline==="video") setVideoEnabled(!!msg.enabled);
      if(msg.pipeline==="audio") setAudioEnabled(!!msg.enabled);
      if(msg.pipeline==="microphone") setMicrophoneEnabled(!!msg.enabled);
      if(msg.pipeline==="webcam") setWebcamEnabled(!!msg.enabled);
      if(typeof msg.pipeline==="string") sendInput({t:"pipeline",pipeline:msg.pipeline,enabled:!!msg.enabled});
      break;
    case "audioDeviceSelected":
      if(typeof msg.context==="string"){
        sendInput({t:"audioDevice",context:msg.context,deviceId:msg.deviceId});
      }
      if(msg.context==="input"){
        audioInputDeviceId=typeof msg.deviceId==="string"?msg.deviceId:"";
        // Live swap: restart capture with the newly selected input if mic is on.
        if(microphoneRecorder&&microphoneRecorder.state==="recording"){
          clearMicrophoneResources();
          setMicrophoneEnabled(true);
        }
      }
      if(msg.context==="output"){
        audioSinkId=typeof msg.deviceId==="string"?msg.deviceId:"";
        applyAudioSink(playingAudio);
      }
      break;
    case "setManualResolution":
      sendInput({t:"resize",w:msg.width,h:msg.height});
      break;
    case "resetResolutionToWindow":
      sendInput({t:"resize",w:Math.round(innerWidth),h:Math.round(innerHeight),reset:true});
      break;
    case "setUseCssScaling":
      sendInput({t:"cssScaling",value:!!msg.value});
      break;
    case "settings":
      if(msg.settings) sendInput({t:"settings",settings:msg.settings});
      break;
    case "command": {
      const value=String(msg.value??msg.command??msg.payload?.command??"");
      const compact=value.toLowerCase().replace(/[^a-z]/g,"");
      if(compact==="ctrlaltdel"||compact==="ctrlaltdelete") sendInput({t:"command",command:"ctrl-alt-delete"});
      else sendInput(Object.assign({t:"command"},msg));
      break;
    }
    case "getStats": postStats(); break;
    // Apps and Sharing stay hidden. Gaming stays noop. Pointer lock is not used.
    // Gaming stays noop. Pointer lock is not used.
    case "gamepadControl":
    case "requestGamingMode":
    case "sidebarVisibilityChanged":
    case "TOUCH_GAMEPAD_SETUP":
    case "TOUCH_GAMEPAD_VISIBILITY":
    case "touchinput:trackpad":
    case "touchinput:touch":
    case "setSynth":
    case "mode":
      break;
    default:
      break;
  }
});
applyScale();
applySmoothing();
applyCursorMode();
setStatus("disconnected");
if(session.trim()&&token.trim()) connect();
